apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openresidency.name" . }}
  labels: {{- include "openresidency.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "openresidency.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels: {{- include "openresidency.labels" . | nindent 8 }}
      {{- if .Values.metrics.enabled }}
      # Pod-level scrape target. The metrics port is deliberately NOT on the Service, so the
      # ingress cannot route to it; a Prometheus that discovers pods finds it here.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.port | quote }}
        prometheus.io/path: /metrics
      {{- end }}
    spec:
      {{- if .Values.migrations.enabled }}
      initContainers:
        - name: migrate
          image: {{ include "openresidency.image" . | quote }}
          command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
          envFrom:
            - secretRef: { name: {{ include "openresidency.secretName" . }} }
      {{- end }}
      containers:
        - name: app
          image: {{ include "openresidency.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
          envFrom:
            - configMapRef: { name: {{ include "openresidency.name" . }}-config }
            - secretRef: { name: {{ include "openresidency.secretName" . }} }
          # Readiness asks the database (a pod that cannot reach Postgres must not take
          # traffic); liveness asks only whether the process answers. Both are unauthenticated
          # and exempt from the application rate limit.
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openresidency.name" . }}
  labels: {{- include "openresidency.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "openresidency.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
