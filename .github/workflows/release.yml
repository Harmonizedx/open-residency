# Release artifacts: an SBOM, a source archive, signatures, and build provenance.
#
# DPG Standard indicators 8 and 9a ask for adherence to security best practice and for the
# supply chain to be inspectable. An SBOM that exists only as a CI build artifact is not that:
# it expires with the workflow run and a deploying government cannot reach it. This attaches
# one to the release itself, and signs what it attaches.
#
# Signing is KEYLESS (Sigstore/Fulcio). There is no private key to store, rotate, or leak: the
# signature is bound to this workflow's OIDC identity, so what a verifier checks is "produced
# by this repository's release workflow", which is the claim that actually matters and is
# stronger than "signed by whoever holds a secret in repository settings".
#
# Three jobs. `release` signs what the source release ships. `image` builds the container from
# the same ref, scans it, pushes it to GHCR, signs it BY DIGEST and attests its provenance --
# so the artifact a deployment actually runs is covered by the same claims as the tarball,
# rather than being whatever the adopter's own build produced. Version tags only, never
# `latest`: RELEASING.md defines a release as "never a moving pointer", and a floating tag is
# exactly that. `sdk` publishes the npm client through npm's trusted publishing, which is the
# same idea again: the registry trusts this workflow's OIDC identity, so there is no publish
# token in repository settings to leak, and npm attaches provenance on its own.
name: Release

on:
  push:
    tags: ['v*']
  # Manual runs are allowed so the workflow can be exercised before it first matters. A
  # release that only ever runs on a tag is a release that first runs when it is least
  # convenient for it to fail.
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or ref to package
        required: false

permissions:
  contents: write # attach assets to the release
  id-token: write # OIDC identity for keyless signing and provenance
  attestations: write

jobs:
  release:
    name: SBOM, signatures, and provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Generated from the installed tree rather than the manifest, so it records the
      # versions actually resolved rather than the ranges requested.
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx --sbom-type application > sbom.cyclonedx.json

      # The suite's build (`tsc -p tsconfig.core.json`) compiles every script, and the
      # persistence contract script imports the generated Prisma client. Without this the
      # compile fails, the suite never runs, and -- the first dry run proved it -- an EMPTY
      # verdict gets signed and shipped.
      - name: Generate the Prisma client
        run: npx prisma generate

      # The ORCS §15 position, recorded by running the suite against the tagged tree and
      # shipped with the release -- as a signed asset and verbatim in the notes. RELEASING.md
      # requires the verbatim result; before this it had to be pasted in by hand after the
      # workflow ran, and nothing checked that it was.
      #
      # Two different things must not be confused here. A FAIL verdict is a RESULT: the suite
      # exits non-zero when any criterion is not PASS, and an honest count is the release
      # requirement, not all-PASS -- so its exit code is ignored. A MISSING verdict is an
      # ERROR: the file would be signed and attached looking complete, which is the failure
      # this workflow's header exists to prevent -- so the step fails unless the summary line
      # is actually there.
      - name: Record the ORCS §15 conformance position
        run: |
          npm run conformance:orcs > conformance.log 2>&1 || true
          sed -n '/== ORCS .15 acceptance criteria ==/,$p' conformance.log > ORCS-CONFORMANCE.txt
          if ! grep -qE '^== ORCS .15: [0-9]+ pass' ORCS-CONFORMANCE.txt; then
            echo "::error::the conformance suite produced no verdict; refusing to sign an empty record"
            cat conformance.log
            exit 1
          fi
          cat ORCS-CONFORMANCE.txt

      # A manual run from a branch has a ref name with a slash in it (feat/x), which `git
      # archive` would read as a directory that does not exist -- so the one path this
      # workflow exists to let you rehearse on failed on the filename. Slashes become dashes.
      - name: Package the source archive
        run: |
          VERSION="${GITHUB_REF_NAME:-untagged}"
          VERSION="${VERSION//\//-}"
          git archive --format=tar.gz --prefix="open-residency-${VERSION}/" \
            -o "open-residency-${VERSION}.tar.gz" HEAD
          echo "ARCHIVE=open-residency-${VERSION}.tar.gz" >> "$GITHUB_ENV"

      - name: Checksums
        run: sha256sum sbom.cyclonedx.json ORCS-CONFORMANCE.txt "$ARCHIVE" > SHA256SUMS

      - uses: sigstore/cosign-installer@v3

      # sign-blob for the files; the image is signed by digest in the `image` job below,
      # because cosign signs images IN a registry and this job has nothing in one yet.
      - name: Sign the release artifacts
        run: |
          for f in sbom.cyclonedx.json ORCS-CONFORMANCE.txt "$ARCHIVE" SHA256SUMS; do
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done

      # Provenance is the machine-checkable half: it records which workflow, at which commit,
      # produced these bytes. A signature says who; provenance says how.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            sbom.cyclonedx.json
            ORCS-CONFORMANCE.txt
            ${{ env.ARCHIVE }}

      # Pushing a tag creates a TAG. It does not create a RELEASE -- they are separate objects,
      # and `gh release upload` fails outright when the release does not exist. So the
      # documented `git tag -s && git push origin vX.Y.Z` would have built and signed
      # everything and then failed on the last step with "release not found", which is exactly
      # the failure this workflow's header warns about: one that first appears when it is least
      # convenient.
      #
      # Create it when absent, so a tag push is sufficient on its own. Idempotent: a release
      # made through the UI (which pushes the tag, firing this same workflow) is found and
      # reused rather than duplicated.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "No release for $GITHUB_REF_NAME yet; creating it."
            # --verify-tag refuses to invent a tag: if the ref is not a real tag, fail here
            # rather than publish a release pointing at nothing.
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          else
            echo "Release $GITHUB_REF_NAME already exists; attaching to it."
          fi

          gh release upload "$GITHUB_REF_NAME" \
            sbom.cyclonedx.json sbom.cyclonedx.json.sig sbom.cyclonedx.json.pem \
            ORCS-CONFORMANCE.txt ORCS-CONFORMANCE.txt.sig ORCS-CONFORMANCE.txt.pem \
            "$ARCHIVE" "${ARCHIVE}.sig" "${ARCHIVE}.pem" \
            SHA256SUMS SHA256SUMS.sig SHA256SUMS.pem \
            --clobber

          # The verbatim suite output goes into the notes, once. Idempotent so a re-run of the
          # workflow against the same tag does not append it twice.
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > notes.md
          if ! grep -q '^## ORCS §15 conformance' notes.md; then
            {
              printf '\n## ORCS §15 conformance\n\n'
              printf 'Recorded by `npm run conformance:orcs` against this tag. A criterion is met when the suite says PASS; this is a sample of the specification, not a certificate.\n\n```\n'
              cat ORCS-CONFORMANCE.txt
              printf '```\n'
            } >> notes.md
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          fi

      # Kept when the run was manual, so a dry run is inspectable without a tag existing.
      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            sbom.cyclonedx.json*
            ORCS-CONFORMANCE.txt*
            SHA256SUMS*
            *.tar.gz*
          if-no-files-found: error

  image:
    name: Container image, signed by digest
    # The release must exist before the digest can be recorded on it.
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # append the digest to the release notes
      packages: write # push to GHCR
      id-token: write # keyless signing and provenance
      attestations: write
    env:
      # GHCR requires a lowercase path; the owner is `Harmonizedx`. Computed, not typed, so a
      # rename of the repository cannot leave this publishing to a name that no longer exists.
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Lowercase the image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      # Tags are the release version and nothing else. `latest=false` is load-bearing: the
      # metadata action adds a `latest` tag on every tag push unless told not to.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: type=ref,event=tag

      # Build once, locally, and scan BEFORE anything is pushed. The same gate CI applies to
      # every merge -- fixable findings at High and above, see ci.yml for why only-fixed is
      # the design -- so an advisory published between the merge and the tag is caught here
      # rather than shipped. The second build step below reuses this one's layers.
      - name: Build the image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the image for vulnerabilities
        uses: anchore/scan-action@v7
        with:
          image: ${{ env.IMAGE }}:scan
          fail-build: true
          severity-cutoff: high
          only-fixed: true

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed only on a tag. A manual run builds and scans -- so the job can be exercised
      # before it first matters -- and publishes nothing.
      - name: Build and push
        id: push
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      - uses: sigstore/cosign-installer@v3
        if: startsWith(github.ref, 'refs/tags/')

      # By digest, not by tag. A tag can be moved; a digest is the bytes.
      - name: Sign the image
        if: startsWith(github.ref, 'refs/tags/')
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"

      - uses: actions/attest-build-provenance@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # The release page names the exact digest, so an adopter pins to it rather than to a
      # tag, and the verification commands are one copy-paste away from the download.
      - name: Record the image on the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > notes.md
          cat >> notes.md <<EOF

          ## Container image

          \`\`\`
          ${IMAGE}:${GITHUB_REF_NAME}
          ${IMAGE}@${DIGEST}
          \`\`\`

          Verify before you run it:

          \`\`\`bash
          cosign verify "${IMAGE}@${DIGEST}" \\
            --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "${GITHUB_REPOSITORY}"
          \`\`\`
          EOF
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md

  sdk:
    name: SDK to npm, by the workflow's own identity
    # After `release`, so a tree whose conformance suite could not even produce a verdict
    # does not ship a client. Not after `image`: the two are independent, and a registry
    # scan failure is not a reason to withhold a dependency-free TypeScript client.
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # append the npm version to the release notes
      id-token: write # the OIDC token npm exchanges for publish rights
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10. Upgrade the CLI
      # rather than the runtime, so the SDK is still built on the Node line `engines` names.
      - name: npm that can exchange an OIDC token
        run: |
          npm install -g npm@11
          npm --version

      # The SDK's build script is `tsc`, which resolves from the root's node_modules.
      - name: Install dependencies
        run: npm ci

      # RELEASING.md step 7 says sdk/package.json is bumped to match the tag. Enforced here,
      # because the alternative is a registry version that silently trails the release.
      - name: The SDK version is the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          SDK_VERSION="$(node -p "require('./sdk/package.json').version")"
          if [ "v${SDK_VERSION}" != "$GITHUB_REF_NAME" ]; then
            echo "::error::sdk/package.json is ${SDK_VERSION} but the tag is ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Build and inspect the tarball
        working-directory: sdk
        run: |
          npm run build
          npm pack --dry-run

      # Published only on a tag. A manual run builds and packs, so the job can be exercised
      # before it first matters, and publishes nothing. No token: npm sees the OIDC token,
      # checks it against the trusted publisher configured for the package on npmjs.com
      # (this repository, this workflow file), and attaches provenance itself.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: sdk
        run: npm publish --access public

      # The release page names the exact version, alongside the image digest, so the
      # release notes are the one place an adopter reads for everything it shipped.
      - name: Record the SDK on the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > notes.md
          if ! grep -q '^## SDK' notes.md; then
            cat >> notes.md <<EOF

          ## SDK

          \`\`\`
          npm install @openresidency/sdk@${VERSION}
          \`\`\`

          Published by this workflow through npm trusted publishing, with provenance; the
          registry page shows the commit and workflow run that built it.
          EOF
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          fi
