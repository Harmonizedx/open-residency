name: DCO

# The Apache-2.0 license gives HarmonizedX the right to reuse a contribution; it does not,
# on its own, establish that the contributor had the right to give it. The Developer
# Certificate of Origin closes that gap: a `Signed-off-by` trailer is the contributor's
# certification of the statements in the repository's DCO file. CONTRIBUTING.md says every
# commit must carry it -- this is what makes that true rather than aspirational, on every
# pull request including those from forks.
#
# Hermetic and dependency-free, like the rest of CI: a few lines of git, no marketplace
# action to trust with the token. Runs from the base branch's copy for fork PRs, so a fork
# cannot weaken its own check.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  DCO:
    name: DCO
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Every commit carries a Signed-off-by matching its author
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # With fetch-depth 0 the base is present, but a force-push can leave it dangling;
          # fetching it explicitly keeps the range well-defined.
          git fetch --no-tags --depth=200 origin "$BASE_SHA" >/dev/null 2>&1 || true

          fail=0
          # --no-merges: a merge commit is generated by GitHub, not authored, so it neither
          # carries nor needs a sign-off.
          while read -r sha; do
            [ -n "$sha" ] || continue

            author_name="$(git show -s --format='%an' "$sha")"
            # Bots (Dependabot and friends) do not sign off, and GitHub already controls
            # their identity. Requiring a DCO of them would only wedge dependency PRs.
            case "$author_name" in
              *'[bot]') echo "skip ${sha:0:12}  (bot: $author_name)"; continue ;;
            esac

            author_email="$(git show -s --format='%ae' "$sha")"
            subject="$(git show -s --format='%s' "$sha")"

            # The e-mail inside each Signed-off-by trailer on this commit.
            signoff_emails="$(git show -s --format='%B' "$sha" \
              | sed -n 's/^[Ss]igned-off-by:.*<\(.*\)>.*$/\1/p')"

            # -x -F: an exact, whole-line, fixed-string match, so a '+' or '.' in the address
            # is compared literally rather than as a regular expression.
            if printf '%s\n' "$signoff_emails" | grep -qxF "$author_email"; then
              echo "ok   ${sha:0:12}  $subject"
            else
              echo "FAIL ${sha:0:12}  $subject"
              echo "      no 'Signed-off-by:' line matching the author <$author_email>"
              fail=1
            fi
          done < <(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "One or more commits are missing a Developer Certificate of Origin (DCO) sign-off."
            echo "Adding it certifies the statements in the repository's DCO file."
            echo ""
            echo "Fix the most recent commit:"
            echo "    git commit --amend -s --no-edit && git push --force-with-lease"
            echo "Fix several commits (replace 'main' with the base branch):"
            echo "    git rebase --signoff main && git push --force-with-lease"
            echo "Sign off every future commit automatically:"
            echo "    git config format.signoff true"
            echo ""
            echo "See CONTRIBUTING.md -> 'Provenance: DCO and signing', and the DCO file at the repo root."
            exit 1
          fi

          echo ""
          echo "All commits carry a DCO sign-off."
