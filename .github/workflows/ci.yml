name: CI

# The repository had no CI. Nothing ran on a pull request, so a change that broke the
# typecheck or the credential logic could be merged with nobody the wiser -- which is also
# why `npm test` had been pointing at an uninstalled jest since the repo was created and
# nobody had tripped over it.
#
# Everything here is hermetic: no database, no network. The official W3C suite needs a live
# server and is therefore opt-in (`npm run test:w3c`); see test/w3c/README.md, which is
# explicit about what we do and do not run here.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, conformance, and end-to-end checks
    runs-on: ubuntu-latest
    # Backstop. Without it a hung step runs to the platform's 6h ceiling and reports
    # `cancelled`, which reads like a fluke rather than the failure it is.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Prisma client is generated code, and the Nest layer will not typecheck without
      # it. Generating it needs no database connection.
      - name: Generate Prisma client
        run: npx prisma generate

      # The layering rules this repo states in prose, enforced. Discipline holds until the
      # day someone in a hurry imports the convenient thing and nothing fails.
      - name: Architectural fence (core stays framework-agnostic, no cycles)
        run: npm run lint:arch

      # DPG Standard indicator 2 (clear open licence). A LICENSE file states the project's
      # licence; it does not travel with a file somebody copies out, and copying is the point
      # of publishing this. Cheap to keep true, tedious to fix once it has drifted.
      - name: Licence headers on every source file
        run: npm run lint:licenses

      - name: Typecheck
        run: npm run typecheck

      - name: W3C conformance (VC Data Model 2.0, Bitstring Status List, Data Integrity)
        run: npm run test:conformance

      - name: Core smoke test
        run: npm run smoke

      - name: OpenID4VCI issuance (drives the full flow as a wallet)
        run: npm run smoke:oid4vci

      # Inji Draft-13 profile conformance: a wallet behaving exactly as Inji's documented
      # client does, asserting each accommodation AND that each is load-bearing (the
      # c_nonce="null" failure the cNonceInAccessToken flag prevents). Conformance to
      # documented behavior, not the live app -- see docs/INTEROP.md.
      - name: Inji Draft-13 conformance
        run: npm run smoke:inji

      - name: OpenID4VP presentation (drives the flow, and the attacks it must reject)
        run: npm run smoke:oid4vp

      # These two were in `npm test` but never in CI, so nothing gated them. The SSO suite
      # is the one that matters most: it exists to hold down the regression where naming an
      # existing residency ID -- a semi-public value -- was enough to sign in as that
      # person. A guard with no test in front of it is a guard waiting to be refactored out.
      - name: SSO login factors (VP primary, one-time code fallback, and their attacks)
        run: npm run smoke:sso

      # Cross-issuer federation: a credential from a federated peer state verifies here,
      # an unlisted issuer is rejected as UNTRUSTED_ISSUER, and peer key rotation is safe.
      - name: Federation (cross-issuer trust)
        run: npm run smoke:federation

      # The three suites below cover verifying and authenticating against systems we do not
      # control. They are gated for the same reason the custody adapters are: each one is a
      # place where being subtly wrong means accepting something we should have refused, and
      # none of them can be checked against a live deployment from CI.

      # Linked-data proof suites we accept but never emit. The credentials driven here were
      # produced by the reference implementations, not by this codebase, so the suite
      # measures interoperability rather than agreement with ourselves.
      - name: Inbound proof suites (Ed25519Signature2020/2018, RsaSignature2018)
        run: npm run smoke:ld-suites

      # This deployment as a RELYING party at an external provider: private_key_jwt, PKCE,
      # pinned provider keys, nested-JWT userinfo, and each failure mode failing closed.
      - name: Upstream OIDC sign-in (external identity provider)
        run: npm run smoke:upstream-oidc

      # MOSIP IDA's encrypted envelope, driven against a server that actually opens it. A
      # client that got the GCM IV placement, the digest case, or the base64 padding wrong
      # fails here exactly as it would against a real deployment.
      - name: MOSIP ID Authentication envelope
        run: npm run smoke:mosip-ida

      # The authoritative statement of MOSIP integration state, and a real gate: it exits
      # non-zero on any non-PASS. It re-runs the four suites above rather than trusting that
      # they ran, and adds the check none of them can make individually -- that no control
      # flow in src/core branches on a vendor identifier, which is what keeps the whole
      # integration optional rather than architectural. The individual steps above are kept
      # so a failure says which capability broke without reading the summary.
      - name: MOSIP integration conformance (gate)
        run: npm run conformance:mosip

      # WebAuthn passkey factor (registration + assertion verification against a simulated
      # authenticator, both ES256 and EdDSA) and the assurance model (acr/amr, biometric
      # step-up). Security-critical crypto, so it is gated.
      - name: WebAuthn step-up factor and assurance model
        run: npm run smoke:webauthn

      # WebAuthn service flow: registration (authorized by an existing factor),
      # authentication, and the challenge-lifecycle guards (single-use, time/purpose/
      # resident-bound). The HTTP endpoints + real passkey enroll/login are exercised in the
      # Postgres e2e job.
      - name: WebAuthn registration/authentication flow
        run: npm run smoke:webauthn-service

      # Bring-your-own biometric authority (config-driven HTTP matcher). Proves the two
      # properties that make it more than a config copy of the messaging provider:
      # FAIL-CLOSED (any error/timeout/bad response is a non-match, never a pass) and
      # capture privacy (the live sample never leaves the result). Plus AAL3 composition.
      - name: Biometric authority (bring-your-own, fail-closed)
        run: npm run smoke:biometric

      # Boots the real oidc-provider from buildOidcConfiguration and drives a full
      # Authorization Code + PKCE flow. This is the suite that catches OIDC client/config
      # defects (id_token alg, pairwise subjectTypes) which are invisible until the
      # provider actually runs. Still hermetic -- no database.
      - name: SSO OIDC flow (real provider, Authorization Code + PKCE)
        run: npm run smoke:sso-oidc

      # The non-PII extraction surface we point DPG reviewers at (Standard indicator 6).
      # Gated because the suppression arithmetic is the kind of thing that looks right in
      # the output while quietly leaking: the subtraction attack it prevents is invisible
      # unless something asserts it.
      - name: Non-PII statistics export (aggregation, suppression, RFC 4180 CSV)
        run: npm run smoke:statistics

      # Erasure and retention (DPG indicator 7, ORCS §14). Gated because the load-bearing
      # assertion is one nothing else covers: that the tamper-evident audit chain still
      # verifies AFTER personal data has been removed from it. Get that wrong and the choice
      # is between a citizen's erasure right and an auditable register.
      - name: Erasure and retention (chain survives redaction)
        run: npm run smoke:privacy

      # Consent accountability (ORCS §9). Gated because almost every assertion is a REFUSAL --
      # a grant naming no controller, citing an unregistered legal basis, or holding no
      # evidence of agreement must not be written. Those are the paths that silently start
      # accepting blanks when a caller is "fixed" to stop erroring.
      - name: Consent and the Legal Basis Registry (refusals, replacement, expiry exception)
        run: npm run smoke:consent

      - name: Foundational sources (XML/SOAP and imported dataset adapters)
        run: npm run smoke:sources

      # The four suites below existed and passed, but ran only under `npm test` -- no CI step
      # referenced them, so nothing gated them on a pull request. That is 136 assertions of
      # coverage the build was not enforcing, on the two areas least able to afford it:
      # issuer-key custody and the operator role model.
      - name: Operator identity, roles, and per-operator API keys
        run: npm run smoke:operator

      # Issuer-key custody. A deployment signing with a key it does not hold in an HSM or KMS
      # is the single failure that invalidates every credential it ever issued, so the
      # custody adapters are gated rather than trusted. All three are hermetic: the KMS
      # suites drive mock cloud services, and the PKCS#11 suite drives a real SoftHSM token
      # created below. None needs credentials.
      #
      # SoftHSM must be installed explicitly. The runner does not ship it, and the suite is
      # written to skip cleanly when it is absent -- correct on a laptop, silently green in
      # CI, which is how this step passed for weeks without asserting anything. REQUIRE_HSM=1
      # below turns any skip into a failure, so it cannot regress to a no-op unnoticed.
      #
      # This step hung for six hours on 2026-08-19 (run 32207221401) and produced no output at
      # all before the job hit the platform's 6h ceiling and was reported as `cancelled`. apt
      # waits on the dpkg lock INDEFINITELY by default, and a GitHub runner boots with
      # `unattended-upgrades` and the apt-daily timers already holding it -- so a step that
      # normally takes eight seconds can block for as long as the job is allowed to live.
      #
      # `DPkg::Lock::Timeout` bounds that wait, the retry covers a transient mirror, and
      # `timeout-minutes` is the backstop for anything neither anticipates: an installer that
      # hangs now fails in five minutes with a log, rather than burning six hours of runner
      # time and reporting a verdict that looks like a fluke.
      - name: Install SoftHSM (PKCS#11 token for the custody suite)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo apt-get -o DPkg::Lock::Timeout=120 update \
              && sudo apt-get -o DPkg::Lock::Timeout=120 install -y softhsm2; then
              exit 0
            fi
            echo "::warning::apt attempt ${attempt} failed; retrying in 10s"
            sleep 10
          done
          echo "::error::could not install softhsm2 after 3 attempts"
          exit 1

      - name: Issuer key custody — PKCS#11 HSM
        run: npm run smoke:hsm
        env:
          REQUIRE_HSM: '1'

      - name: Issuer key custody — Google Cloud KMS
        run: npm run smoke:gcpkms

      - name: Issuer key custody — AWS KMS
        run: npm run smoke:awskms

  sso-e2e:
    name: Full-stack SSO (real NestJS app + Postgres)
    runs-on: ubuntu-latest
    # Backstop. Without it a hung step runs to the platform's 6h ceiling and reports
    # `cancelled`, which reads like a fluke rather than the failure it is.
    timeout-minutes: 15
    # This is the only job with a database, and it exists for one reason: to boot the
    # ACTUAL application. Every other job is hermetic core logic that never calls
    # NestFactory.create(AppModule) -- which is exactly how a dependency-injection defect
    # once left the whole app unable to start while CI stayed green. This job drives a real
    # "Sign in with the State" flow through the real InteractionController, so a boot
    # failure or a broken interaction fails the build instead of shipping.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openres_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/openres_e2e
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # `migrate deploy`, not `db push`. A deployment applies the committed migrations, so a
      # CI job that derived the schema from schema.prisma would pass against a shape no
      # deployment can reach -- which is how a missing migrations directory once went
      # unnoticed while every check was green.
      - name: Apply migrations to the service database
        run: npx prisma migrate deploy

      - name: Build the application
        run: npm run build

      - name: Drive the real app end-to-end (boot, login, consent, tokens)
        run: node scripts/sso-nest-e2e.cjs

  sbom:
    name: SBOM and dependency audit
    runs-on: ubuntu-latest
    # Backstop. Without it a hung step runs to the platform's 6h ceiling and reports
    # `cancelled`, which reads like a fluke rather than the failure it is.
    timeout-minutes: 15
    # A published SBOM is what lets a deploying government answer "are we exposed to this
    # CVE?" without reading our lockfile. DPG Standard indicator 8 and ORCS §13 ask for it;
    # ORCS §13 also lists data portability and vendor exit, and an SBOM is part of being
    # auditable from the outside.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # CycloneDX, generated from the installed tree rather than the manifest, so it records
      # the versions actually resolved.
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx --sbom-type application > sbom.cyclonedx.json

      - name: Publish SBOM as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          if-no-files-found: error

      # Blocking gate on runtime dependencies, set at MODERATE.
      #
      # It sat at `critical` while the tree could not pass at `high`: undici (via jsonld),
      # lodash (via @nestjs/config), and multer with @nestjs/platform-express all carried
      # high-severity advisories whose only fixes were semver-major bumps. Those majors have
      # since landed -- jsonld@9, the NestJS 11 family, js-yaml and jose -- and the tree now
      # reports zero advisories at every severity, dev included.
      #
      # Set at `moderate` rather than `high` deliberately. With the tree clean, the useful
      # question is no longer "does it hold today" but "what may pass unnoticed tomorrow", and
      # a moderate-severity advisory reaching a government deployment is worth stopping a build
      # for. If this proves too tight in practice, loosen it in a commit that says why --
      # do not disable the step.
      #
      # `--omit=dev` because this gate is about what a deployed instance runs. Dev-only
      # advisories are reported in the step below rather than hidden.
      - name: Audit runtime dependencies (moderate fails the build)
        run: npm audit --omit=dev --audit-level=moderate

      # Full picture, non-blocking: every severity including dev-only. Dependabot opens the
      # PRs; this makes the standing debt visible on every run so it cannot quietly grow.
      - name: Report all advisories (informational)
        if: always()
        continue-on-error: true
        run: npm audit || true

  build:
    name: Docker image builds
    runs-on: ubuntu-latest
    # Backstop. Without it a hung step runs to the platform's 6h ceiling and reports
    # `cancelled`, which reads like a fluke rather than the failure it is.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The runtime image must carry contexts/, or JSON-LD issuance fails at RUN time with
      # a missing-context error rather than at build time. Building it here keeps that
      # from regressing.
      - name: Build container image
        run: docker build -t open-residency:ci .

      # The npm audit gate above covers our dependencies. It says nothing about the base
      # image -- the OS packages a deploying government actually runs. Scanning the built
      # image is what makes the supply-chain claim cover the whole artifact rather than the
      # half of it written in JavaScript.
      #
      # BLOCKING, on FIXABLE findings only, at High and above.
      #
      # only-fixed is the whole design, and it is not a softening. A Debian base carries
      # dozens of High advisories the distribution has marked won't-fix, several of them
      # decade-old disputes upstream rejects as vulnerabilities at all. Gating on those
      # leaves two options -- a waiver list nobody can honestly maintain, or a threshold
      # raised until the noise stops -- and both end with a green tick that means nothing.
      #
      # Gating on fixable findings asks the question a build can actually answer: a fix
      # exists and this image does not have it. That is always a defect, and it is always
      # actionable. The Dockerfile earns it by upgrading Debian packages and the bundled npm
      # on top of the pinned digest, so "fixable" stays a small set rather than a backlog.
      #
      # Unfixable exposure is not thereby dismissed. It is inherent to the base image, and
      # the honest remedy is a smaller base (distroless), tracked in #120 -- not a line in
      # an ignore file claiming glibc is unreachable in a process that links it.
      - name: Scan the image for vulnerabilities
        id: grype
        uses: anchore/scan-action@v7
        with:
          image: open-residency:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: sarif

      - name: Publish the scan findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-vulnerability-scan
          path: ${{ steps.grype.outputs.sarif }}
          if-no-files-found: warn

  store-e2e:
    name: Persistence contract (every store, real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The default suite is hermetic -- in-memory stores, no database -- which makes a whole
    # class of defect structurally invisible to it: anything that exists only between the
    # record and the column. Two such defects shipped and were caught by hand. This job
    # round-trips every store against the committed migrations so the next one is caught here.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openres_store_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/openres_store_e2e
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Persistence contract
        run: npm run test:store-e2e
