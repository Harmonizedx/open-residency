<svg viewBox="0 0 960 500" role="img" aria-label="C4 Level 3 — the residency context as a hexagon: driving adapters left, infrastructure adapters right" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs><marker id="ah3" markerWidth="9" markerHeight="9" refX="6.4" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#96a0ae"/></marker></defs>
  <!-- column headers -->
  <text x="24" y="40" fill="#5b6674" font-size="10.5" font-weight="640" letter-spacing=".06em" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">DRIVING ADAPTERS · inbound</text>
  <text x="936" y="40" text-anchor="end" fill="#5b6674" font-size="10.5" font-weight="640" letter-spacing=".06em" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">INFRASTRUCTURE ADAPTERS · outbound</text>
  <!-- the hexagon (application + domain core) -->
  <polygon points="630,250 550,389 390,389 310,250 390,111 550,111" fill="#e9f5f1" stroke="#0f8f7e" stroke-width="2"/>
  <text x="470" y="160" text-anchor="middle" fill="#0e5a4f" font-size="13"><tspan x="470" font-weight="700">Application</tspan><tspan x="470" dy="15" font-size="10.5" fill="#12665b">use cases · IssueResidency</tspan></text>
  <rect x="372" y="222" width="196" height="78" rx="10" fill="#d3efe7" stroke="#0f8f7e" stroke-width="1.5"/>
  <text x="470" y="250" text-anchor="middle" fill="#094f45" font-size="13"><tspan x="470" font-weight="700">Domain</tspan><tspan x="470" dy="15" font-size="10.5" fill="#12665b">Resident · ResidentId</tspan><tspan x="470" dy="13" font-size="10.5" fill="#12665b">rules &amp; invariants (no framework)</tspan></text>
  <!-- ports on the hexagon edges -->
  <circle cx="310" cy="250" r="6.5" fill="#fbf1dd" stroke="#b5791b" stroke-width="2"/>
  <circle cx="630" cy="250" r="6.5" fill="#fbf1dd" stroke="#b5791b" stroke-width="2"/>
  <text x="344" y="243" text-anchor="middle" fill="#5a3d0a" font-size="9.5"><tspan x="344">inbound</tspan><tspan x="344" dy="11">port</tspan></text>
  <text x="598" y="243" text-anchor="middle" fill="#5a3d0a" font-size="9.5"><tspan x="598">outbound</tspan><tspan x="598" dy="11">ports</tspan></text>
  <!-- flow arrows: driving adapters drive the core (left → in) -->
  <g fill="none" stroke="#b7c0cc" stroke-width="1.7" marker-end="url(#ah3)">
    <path d="M206,146 C270,150 300,158 352,172"/>
    <path d="M206,252 L300,250"/>
    <path d="M206,358 C270,352 300,344 352,330"/>
  </g>
  <!-- flow arrows: the core drives the infrastructure (out → right) -->
  <g fill="none" stroke="#b7c0cc" stroke-width="1.7" marker-end="url(#ah3)">
    <path d="M590,168 C640,150 690,132 750,122"/>
    <path d="M628,238 C670,222 700,210 750,200"/>
    <path d="M628,262 C670,278 700,290 750,300"/>
    <path d="M590,332 C640,350 690,368 750,378"/>
  </g>
  <!-- driving adapters (left) -->
  <g>
    <rect x="26" y="118" width="180" height="56" rx="9" fill="#e8edfd" stroke="#2f54c9"/><text x="116" y="142" text-anchor="middle" fill="#1a2b6b" font-size="13"><tspan x="116" font-weight="700">HTTP</tspan><tspan x="116" dy="15" font-size="10.5" fill="#3a4a86">ResidencyController</tspan></text>
    <rect x="26" y="224" width="180" height="56" rx="9" fill="#e8edfd" stroke="#2f54c9"/><text x="116" y="248" text-anchor="middle" fill="#1a2b6b" font-size="13"><tspan x="116" font-weight="700">USSD gateway</tspan><tspan x="116" dy="15" font-size="10.5" fill="#3a4a86">feature-phone channel</tspan></text>
    <rect x="26" y="330" width="180" height="56" rx="9" fill="#e8edfd" stroke="#2f54c9"/><text x="116" y="354" text-anchor="middle" fill="#1a2b6b" font-size="13"><tspan x="116" font-weight="700">CLI / tests</tspan><tspan x="116" dy="15" font-size="10.5" fill="#3a4a86">smoke scripts</tspan></text>
  </g>
  <!-- infrastructure adapters (right) -->
  <g>
    <rect x="754" y="92" width="200" height="54" rx="9" fill="#efe7fb" stroke="#7b4fc9"/><text x="854" y="114" text-anchor="middle" fill="#3f2470" font-size="12.5"><tspan x="854" font-weight="700">Persistence</tspan><tspan x="854" dy="15" font-size="9.5" fill="#5a3a94">PrismaResidencyStore → PostgreSQL</tspan></text>
    <rect x="754" y="170" width="200" height="54" rx="9" fill="#efe7fb" stroke="#7b4fc9"/><text x="854" y="192" text-anchor="middle" fill="#3f2470" font-size="12.5"><tspan x="854" font-weight="700">Foundational ID</tspan><tspan x="854" dy="15" font-size="9.5" fill="#5a3a94">NIN · Aadhaar (REST / SOAP)</tspan></text>
    <rect x="754" y="248" width="200" height="54" rx="9" fill="#efe7fb" stroke="#7b4fc9"/><text x="854" y="270" text-anchor="middle" fill="#3f2470" font-size="12.5"><tspan x="854" font-weight="700">Messaging</tspan><tspan x="854" dy="15" font-size="9.5" fill="#5a3a94">SMS / OTP gateway</tspan></text>
    <rect x="754" y="326" width="200" height="54" rx="9" fill="#efe7fb" stroke="#7b4fc9"/><text x="854" y="348" text-anchor="middle" fill="#3f2470" font-size="12.5"><tspan x="854" font-weight="700">Signer</tspan><tspan x="854" dy="15" font-size="9.5" fill="#5a3a94">HSM · KMS custody</tspan></text>
  </g>
  <!-- flow / dependency note -->
  <text x="480" y="440" text-anchor="middle" fill="#6b7484" font-size="11" font-style="italic">Data &amp; control flow left → right · source-code dependencies point inward to the domain</text>
</svg>
