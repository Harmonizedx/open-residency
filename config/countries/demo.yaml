# Demo jurisdiction - MOCK foundational provider.
#
# Wire this up to run the ENTIRE stack (issue -> credential -> SSO -> verify) with no
# live national ID API. Any identifier whose primary value ends in an even digit
# verifies. Never enable a MOCK config in production.

countryCode: ZZ
countryName: Demoland
defaultSubnationalUnit: DX

foundational:
  provider: MOCK
  inputs:
    - { key: nationalId, label: National ID (even last digit = verifies in demo) }
  assuranceOnSuccess: verified

residency:
  # This demo does not require a person to bind the applicant, so a decision can be taken with
  # nobody having looked at them. Declared here because the config refuses to load otherwise --
  # and because a demo that quietly skipped the safeguard would teach the wrong shape.
  humanReview:
    path: 'Demo deployment: reconsideration would be requested at the enrolment desk'
    withinDays: 30
  minAssurance: verified
  proofOfResidence: attestation
  allowProvisional: true
  # Applicant->identity binding is RECORDED on every credential regardless; here it is not
  # REQUIRED, so the full stack runs end-to-end from a browser with no operator step. The
  # MOCK provider is a bare lookup and attests no binding, so credentials issued here carry
  # `applicantBinding.method: none` -- which is exactly the point: a demo lookup is not owner
  # proof. A real deployment sets required: true (see ng.yaml / in.yaml). To simulate an
  # owner-authenticating source instead, set foundational.authenticatesApplicant: true.
  applicantBinding:
    required: false
    acceptedMethods: [authoritative_authentication, face_match, attended_comparison]

credential:
  issuerDid: did:web:id.demoland.example
  issuerName: Demoland Residency Authority
  type: StateResidencyCredential
  validityDays: 365
  context:
    - https://www.w3.org/ns/credentials/v2

subnationalUnits:
  - { code: DX, name: Demo District, parent: ZZ, level: state }

# ---------------------------------------------------------------------------
# MOSIP ID Authentication (IDA) as the foundational provider. OPTIONAL.
#
# Most national ID APIs are one REST call and need no code -- describe the request and the
# response mapping above and you are done. IDA is the exception: its request body is an
# encrypted envelope, so it has a real adapter (provider: MOSIP_IDA) rather than a request
# template. Nothing about the envelope is configurable; it is fixed by MOSIP.
#
# WHAT IT ESTABLISHES. IDA authenticates -- by an OTP to the device registered on the
# AUTHORITATIVE record, or by demographic match -- so a success attests
# `authoritative_authentication`, the strongest applicant binding there is. It is not a
# lookup, and it is not treated as one. Note that /auth returns a yes or a no: the
# attributes on a successful result are the ones the applicant submitted and MOSIP
# CONFIRMED. To RETRIEVE the attributes MOSIP holds, turn on eKYC below -- deliberately a
# separate decision, because it asks the authority to release data rather than confirm it.
#
# WHAT YOU MUST OBTAIN FIRST. None of this can be defaulted, and the adapter refuses to
# start without it. All of it comes from partner onboarding, not from this repository:
#
#   - registration as an auth partner under a MISP, and the MISP licence key
#   - your partner id, and the policy-linked partner API key
#   - your signing and encryption certificates, uploaded via the partner portal
#   - MOSIP's own partner certificate, which the session key is encrypted to
#
# Secrets are named as ENV VARS, never inlined. The two certificates are public material
# and belong here; the keys they correspond to do not.
#
# foundational:
#   provider: MOSIP_IDA
#   baseUrl: https://api.sandbox.mosip.net
#   assuranceOnSuccess: high        # what an IDA authentication is worth in YOUR policy
#   inputs:
#     - { key: individualId, label: UIN or VID }
#     - { key: otp, label: One-time code, required: false, secret: true }
#   extra:
#     mispLicenseKeyEnv: IDA_MISP_LICENSE_KEY
#     partnerId: your-partner-id
#     partnerApiKeyEnv: IDA_PARTNER_API_KEY
#     signingKeyEnv: IDA_SIGNING_KEY          # PKCS#8 PEM, for the `signature` header
#     signingCertificatePem: |
#       -----BEGIN CERTIFICATE-----
#       ...your partner signing certificate...
#       -----END CERTIFICATE-----
#     idaCertificatePem: |
#       -----BEGIN CERTIFICATE-----
#       ...MOSIP's partner certificate...
#       -----END CERTIFICATE-----
#     domainUri: https://api.sandbox.mosip.net
#     environment: Developer
#     individualIdType: UIN
#     otpChannels: [PHONE]
#     # eKYC: retrieve the attributes MOSIP holds, instead of only authenticating. OFF by
#     # default, and the default is the private one -- /auth releases nothing about the
#     # person. Turning this on asks the authority to hand over demographic data, so request
#     # only the claims you can justify. Needs your ENCRYPTION key (the response is encrypted
#     # to it) and IDA's signing certificate (to verify the signature inside it -- decrypting
#     # alone proves only that it was encrypted to you, not that MOSIP asserted it).
#     kyc: true
#     kycDecryptionKeyEnv: IDA_KYC_DECRYPTION_KEY
#     kycClaims: [sub, name, birthdate, gender, phone_number]
#     idaSigningCertificatePem: |
#       -----BEGIN CERTIFICATE-----
#       ...IDA's signing certificate...
#       -----END CERTIFICATE-----

# ---------------------------------------------------------------------------
# Wallet interoperability profile (OpenID4VCI). OPTIONAL.
#
# Every value below is the default, spelled out here so the trade-offs are visible. Omit
# this whole block and you get exactly this. The defaults are the WIDEST possible surface,
# so that the hardest real wallet -- MOSIP's Inji, still on Draft 13 and hardcoding RS256 --
# works with no tuning.
#
# None of this is Inji-specific: the code speaks the standards and sniffs no wallet. But
# width has a cost, and a deployment should be able to decline to pay it. See docs/INTEROP.md.
# ---------------------------------------------------------------------------
wallet:
  # ldp_vc is what wallets accept (Inji REJECTS jwt_vc_json outright).
  # jwt_vc_json is compact, needs no canonicalization, and fits in a printed QR -- it is
  # the offline path. Most deployments want both.
  formats: [ldp_vc, jwt_vc_json]

  # RS256 is accepted ONLY because Inji hardcodes it. Drop it once your wallets have moved
  # on; EdDSA keeps credentials small, which is what makes the QR code scannable.
  proofAlgs: [EdDSA, ES256, RS256]

  compatibility:
    # Accept the OpenID4VCI Draft 13 wire format as well as 1.0. Turning this off narrows
    # the request surface we accept, which is a security improvement -- do it as soon as
    # every wallet you serve is on 1.0.
    draft13: true
    # Duplicate c_nonce/client_id into the access token. This is in NO version of the spec;
    # Inji reads the nonce from inside the token rather than from the response body. If you
    # do not serve Inji, set this false rather than emit a non-standard claim for nobody.
    cNonceInAccessToken: true

  offer:
    ttlSeconds: 900        # a citizen scanning a QR at a desk: minutes, not hours
    txCodeLength: 6        # the spoken second factor; NOT carried in the QR
    maxTxCodeAttempts: 5   # a short numeric PIN is only safe if guesses are bounded

  accessTokenTtlSeconds: 600
  nonceTtlSeconds: 300

# Presentation profile (OpenID4VP). Deployment-wide: a presentation request names no country,
# so this is read from the default (first) country config.
presentation:
  requestTtlSeconds: 300
  # DCQL is OpenID4VP 1.0; presentation_definition is Presentation Exchange, which wallets
  # mid-migration still use. Emitting both means not having to guess which a wallet speaks.
  query: [dcql, presentation_definition]

# ---------------------------------------------------------------------------
# Sign-in relying parties (OpenID Connect). OPTIONAL.
#
# These are the sector services that authenticate citizens through this residency IdP --
# "Sign in with <State>". They never see the national ID, only the residency claims the
# citizen consents to release. Each RP is entitled to exactly one sector scope.
#
# Previously this list was hardcoded in TypeScript, which made a relying party the one
# thing about a country that needed a code change. It is now config, like everything else.
#
# The client SECRET is never here: it is read from <CLIENT_ID>_CLIENT_SECRET in the
# environment (e.g. HEALTH_CLIENT_SECRET). The app refuses to start if one is missing.
#
# Note `scopes` on each RP. `residency` releases resident_id -- the same value at every
# service -- so it is granted only where there is a reason to hold the number itself.
# Health and Permits get `profile` and their sector scope and can read the assurance
# claims without ever seeing the residency number.
# ---------------------------------------------------------------------------
oidc:
  # Each RP sees a different `sub` for the same citizen, so two services cannot join
  # their records on it.
  subjectType: pairwise
  relyingParties:
    - clientId: health
      name: Demoland Health Service
      sector: health
      scopes: [profile]
      redirectUris: [http://localhost:4001/callback]
      postLogoutRedirectUris: [http://localhost:4001]
    - clientId: tax
      name: Demoland Revenue Authority
      sector: tax
      # Statutory basis for holding the residency number itself.
      scopes: [profile, residency]
      redirectUris: [http://localhost:4002/callback]
      postLogoutRedirectUris: [http://localhost:4002]
    - clientId: permits
      name: Demoland Permits Office
      sector: permits
      scopes: [profile]
      redirectUris: [http://localhost:4003/callback]
      postLogoutRedirectUris: [http://localhost:4003]
    - clientId: subsidy
      name: Demoland Subsidy Program
      sector: subsidy
      scopes: [profile, residency]
      redirectUris: [http://localhost:4004/callback]
      postLogoutRedirectUris: [http://localhost:4004]

# ---------------------------------------------------------------------------
# An EXTERNAL provider residents may sign in with. OPTIONAL, absent by default.
#
# The block above is this deployment acting AS a provider. This one is the reverse: it
# acts as a relying party at somebody else's -- a MOSIP eSignet instance, a national eID,
# any conformant OP. Where a jurisdiction's residents already have a national identity
# provider, delegating that first authentication means they do not prove themselves twice,
# and it binds the applicant to the identity far more strongly than a registry lookup can
# (the source itself confirms the owner was present -- `authoritative_authentication`).
#
# Nothing here is provider-specific. The values below happen to be an eSignet deployment's,
# because eSignet is strict about the parts of the standard implementations usually skip:
# private_key_jwt is its ONLY client authentication method, its userinfo response is signed
# and then encrypted (a nested JWT), and its `sub` is pairwise per relying party.
#
# TWO THINGS TO GET RIGHT:
#
#  jwks         the provider's signing keys, PINNED here rather than fetched from its
#               jwks_uri. Whoever answers for that URL at sign-in time otherwise decides
#               which id_tokens you believe. Refresh out of band when the provider rotates.
#  acrMapping   what each authentication method the provider may report is worth HERE.
#               Required, and there is deliberately no default: only you know whether your
#               provider's "password" establishes enough for a residency claim, and the
#               value reaches every relying party as `assurance_level`. An acr the provider
#               returns that is not listed fails the sign-in rather than being credited.
#
# The two *KeyEnv values name environment variables. Never put a private key in this file.
#
# upstreamOidc:
#   issuer: https://esignet.example.gov
#   authorizationEndpoint: https://esignet.example.gov/authorize
#   tokenEndpoint: https://esignet.example.gov/v1/esignet/oauth/v2/token
#   userinfoEndpoint: https://esignet.example.gov/v1/esignet/oidc/userinfo
#   jwks:
#     - { kty: RSA, n: "<base64url>", e: AQAB, kid: op-key-1, alg: RS256, use: sig }
#   clientId: openresidency-demoland
#   redirectUri: https://id.demoland.gov/sso/upstream/callback
#   scopes: [profile, phone]
#   acrValues: ["mosip:idp:acr:biometrics", "mosip:idp:acr:generated-code"]
#   acrMapping:
#     - { acr: "mosip:idp:acr:biometrics", assurance: high }
#     - { acr: "mosip:idp:acr:generated-code", assurance: verified }
#   clientAssertionKeyEnv: UPSTREAM_CLIENT_ASSERTION_KEY
#   userinfoDecryptionKeyEnv: UPSTREAM_USERINFO_DECRYPTION_KEY

# ---------------------------------------------------------------------------
# Operator authentication (deployment-wide; read from the default country config)
# ---------------------------------------------------------------------------
# The demo runs `local` so it works with no external IdP: operator accounts live in
# Postgres with scrypt passwords and TOTP. Bootstrap the first admin by setting
# OPERATOR_BOOTSTRAP_EMAIL and OPERATOR_BOOTSTRAP_PASSWORD -- the TOTP secret is logged
# once, on the boot that creates it.
#
# A real deployment should use `oidc` instead, so staff identity, MFA and de-provisioning
# stay in the ministry's directory and this system holds no staff credentials:
#
#   operatorAuth:
#     mode: oidc
#     oidc:
#       issuer: https://login.katsina.gov.ng/realms/staff
#       audience: openresidency
#       roleClaim: realm_access.roles
#       roleMap:
#         REGISTRY_CLERK: registrar
#         REGISTRY_SUPERVISOR: revoker
#         INTERNAL_AUDIT: auditor
#
# The demo ships `sharedKey` so the quickstart in the README works with nothing but
# ADMIN_API_KEY set. It is the weakest mode and warns loudly on every boot: no operator
# identity, no roles, no rotation. Do not carry it into a real deployment.
#
# To try real operator accounts locally, switch mode to `local` and set
# OPERATOR_BOOTSTRAP_EMAIL / OPERATOR_BOOTSTRAP_PASSWORD -- the first admin is created on
# the next boot and its TOTP secret is logged once:
#
#   operatorAuth:
#     mode: local
#     issuerName: Demoland Residency
#     local:
#       requireMfa: true
operatorAuth:
  mode: sharedKey
  issuerName: Demoland Residency

# ---------------------------------------------------------------------------
# Messaging and contact directory
# ---------------------------------------------------------------------------
# The demo uses the LOG provider, which prints codes instead of sending them, and has to
# say so explicitly -- the acknowledgement is what stops this block being copied into a
# real deployment unnoticed.
#
# A real deployment picks an aggregator. Any of these works without a code change:
#
#   messaging:
#     provider: AFRICASTALKING       # secret in AFRICASTALKING_API_KEY
#     sender: your-at-username
#   messaging:
#     provider: TERMII               # secret in TERMII_API_KEY
#     sender: Katsina
#   messaging:
#     provider: TWILIO               # TWILIO_ACCOUNT_SID + TWILIO_AUTH_TOKEN
#     sender: ACxxxxxxxx             # the Account SID, used in the path
#   messaging:
#     provider: GENERIC_HTTP         # any aggregator with a REST endpoint
#     baseUrl: https://sms.example.ng
#     sender: Katsina
#     auth: { type: bearer, secretEnv: SMS_GATEWAY_TOKEN }
#     request:
#       method: POST
#       path: /v1/messages
#       bodyTemplate: { to: '{to}', from: '{sender}', text: '{body}' }
#       messageIdPath: data.id
#       successFlag: { path: status, equals: accepted }
messaging:
  provider: LOG
  acknowledgeInsecureLogProvider: true

# Where a resident's number comes from at send time. `none` means OTP delivery is off.
# `encrypted` stores the number AES-256-GCM under CONTACT_ENCRYPTION_KEY; `external`
# resolves it from a contact service the ministry already runs and stores nothing here.
contactDirectory:
  mode: none

# ---------------------------------------------------------------------------
# Cross-issuer federation (deployment-wide, read from the default config). OPTIONAL.
#
# By default a deployment trusts only credentials it signed itself: a residency VC from
# another state resolves to UNTRUSTED_ISSUER. List a peer here and its credentials verify
# with the same code that verifies your own -- there is no separate, weaker path.
#
# publicJwks is PUBLIC key material only (a "d" component is refused at load). Give the
# current key first, then any retired keys, so a peer's rotation does not invalidate
# credentials its citizens already hold. statusListUrl is where the peer publishes its
# revocation list, if it does.
#
# A peer that does NOT run this software -- a MOSIP/Inji Certify issuer, say -- needs two
# more things, both per-peer and both off by default:
#
#   acceptedProofSuites  the older linked-data proof suites its credentials carry. We issue
#                        DataIntegrityProof/eddsa-rdfc-2022 and always will; these are
#                        VERIFY-ONLY, and listing one here does not change what you issue.
#                        Scope them to the peer that needs them -- federating with one
#                        legacy issuer is no reason to accept 2018-era proofs from everyone.
#   contexts             the peer's own JSON-LD context document, inline. Its credentials
#                        cannot be canonicalized without it, and the loader will not fetch
#                        it at verification time (see "JSON-LD contexts are pinned" in
#                        docs/INTEROP.md). Pin it here, review it with the keys.
#
# An RSA public key is accepted in publicJwks for the same reason: the peer signs with what
# it signs with. Private components are refused at load, as they are for Ed25519 keys.
#
# federation:
#   trustedIssuers:
#     - did: did:web:id.kano.gov.ng
#       name: Kano State Residency Authority
#       publicJwks:
#         - { kty: OKP, crv: Ed25519, x: "<base64url>", kid: kano-key-1 }
#       statusListUrl: https://id.kano.gov.ng/.well-known/status/ng.json
#     - did: did:web:id.partner.example.gov
#       name: A MOSIP-era partner issuer
#       publicJwks:
#         - { kty: RSA, n: "<base64url>", e: AQAB, kid: partner-rsa-1 }
#       acceptedProofSuites: [RsaSignature2018]
#       contexts:
#         - url: https://partner.example.gov/contexts/residency/v1
#           document:
#             "@context":
#               "@version": 1.1
#               "@protected": true
#               PartnerResidencyCredential: https://partner.example.gov/vocab#PartnerResidencyCredential

# ---------------------------------------------------------------------------
# Biometric authority for the AAL3 sign-in step-up (deployment-wide). OPTIONAL.
#
# Bring-your-own, exactly like the foundational ID source and the SMS aggregator: point
# GENERIC_HTTP at whatever attests biometric matches for your jurisdiction (a national
# ABIS, a MOSIP gateway, a vendor matcher behind an HTTP shim), declare where the yes/no
# verdict lives in the response, and no code changes. Default NONE = no biometric step-up.
#
# The matcher is FAIL-CLOSED: any error, timeout, or unexpected response is a non-match,
# never a pass -- because at AAL3 a false positive is account takeover. The live capture is
# sent ONLY to the authority; it is never stored, logged, or written to the audit trail.
#
# NOTE: bring-your-own does not make it trustworthy. AAL3 is only as strong as the authority
# you point this at -- an endpoint that always says "matched" gives you a meaningless AAL3.
# Point it at the actual authoritative matcher, not a convenience shim.
#
# biometric:
#   provider: GENERIC_HTTP
#   baseUrl: https://abis.demoland.gov
#   source: demoland-national-abis      # recorded in the audit trail
#   auth: { type: bearer, secretEnv: ABIS_TOKEN }
#   request:
#     method: POST
#     path: /verify/{residentId}
#     bodyTemplate: { residentId: "{residentId}", modality: "{modality}", sample: "{sample}" }
#     matchedFlag: { path: result.matched, equals: true }
#     scorePath: result.score
#     sourcePath: result.authority
