# Nigeria - National Identity Number (NIN) as the foundational identity.
#
# This is the shape of a real deployment. It will only return matches once you point
# baseUrl at a licensed NIMC verification gateway and set the NIN_GATEWAY_KEY secret.
# To run the full stack offline for a pilot or demo, use demo.yaml (MOCK provider).

countryCode: NG
countryName: Nigeria
defaultSubnationalUnit: KT

foundational:
  provider: NG_NIN
  baseUrl: https://nin-gateway.example.ng
  timeoutMs: 8000
  auth:
    type: apiKey
    headerName: x-api-key
    secretEnv: NIN_GATEWAY_KEY # the value lives in the environment, never in this file
  # Fields the citizen submits. Drives validation and any auto-generated capture UI.
  inputs:
    - { key: nin, label: National Identification Number, pattern: '^\d{11}$' }
    - { key: dateOfBirth, label: Date of Birth (YYYY-MM-DD) }
  request:
    method: POST
    path: /v1/verify
    bodyTemplate:
      nin: '{identifiers.nin}'
      dob: '{identifiers.dateOfBirth}'
  # Where in the gateway response to read the match flag and attributes.
  verifiedFlag: { path: verification.status, equals: VERIFIED }
  responseMapping:
    givenName: data.firstname
    familyName: data.surname
    dateOfBirth: data.birthdate
    gender: data.gender
    phone: data.telephoneno
    # The NIN record carries BOTH residence and origin. They are mapped to distinct fields
    # and kept apart: only residence is ever offered as proof-of-residence evidence. Origin
    # (indigeneity) is captured but never used to prove residence, and by default is not
    # carried into the residency credential.
    residenceAdminUnit: data.residence_state
    originAdminUnit: data.self_origin_state
  assuranceOnSuccess: verified

residency:
  minAssurance: verified
  proofOfResidence: attestation # ward-level operator or existing register vouches
  allowProvisional: true # permit offline issuance, reconcile when back online
  # A NIN match is a bare registry lookup: anyone who knows the number passes it, so it does
  # NOT prove the applicant owns the identity. Binding must come from the enrolment desk --
  # the same ward operator who attests residence compares the applicant to the NIN record.
  # If NIMC later exposes an owner-authenticating flow (device OTP / eID), add
  # authoritative_authentication here and set foundational.authenticatesApplicant: true.
  applicantBinding:
    required: true
    acceptedMethods: [attended_comparison]
  # Proof of residence is ENFORCED here. The NIN-declared residence state is auto-collected
  # as evidence, but it is self-declared to NIMC and coarse (state-level), so it only reaches
  # RAL1 and must reconcile to the claimed unit. Reaching the required RAL2 needs the ward
  # operator's attestation on top -- the register field lowers friction and cross-checks the
  # claim, it does not by itself prove ward residence. Origin is never eligible.
  residence:
    required: true
    targetLevel: RAL2
    acceptedMethods: [register_declared_residence, authority_attestation, document]
    unitMatchRequired: true
    acceptFoundationalResidence: true
    # The residence RULE comes from each state's law and is not asserted here for Katsina. A
    # Kaduna deployment, under the KADRIMA Law 2021 ("resident for at least six months, or
    # intending to reside"), would declare:
    #   minimumDurationDays: 182
    #   intentToResideSuffices: true
    # and, to register people in displacement or host communities on an accepted word:
    #   attestation: { acceptedAttesterTypes: [ward_officer, traditional_ruler, ward_councillor] }
    #   modes:
    #     noFixedAbode: { allowed: true, acceptedAttesterTypes: [camp_manager, ward_officer], ceiling: RAL1 }

credential:
  issuerDid: did:web:id.katsina.gov.ng
  issuerName: Katsina State Residency Authority
  type: StateResidencyCredential
  validityDays: 1095
  context:
    - https://www.w3.org/ns/credentials/v2

# The Resident ID format is set at the country level (see `residentId:` above -- omitted
# here, so every unit defaults to the Crockford `KT-XXXX-XXXX-C` scheme). A federation lets
# each state run its own statutory numbering: a unit may carry its own `residentId` block to
# override the country default wholesale. It is validated exactly like the country format
# (entropy floor, checksum/alphabet coherence), so a state cannot configure an unsafe ID.
#
# Unit codes. `code` is the deployment's own key and is what records, resident IDs and
# credentials carry. `iso3166_2` names the same unit in ISO 3166-2 (NG-KT, NG-KD, ...), which is
# what NIPOST's digital postcode leads with and what the EUDI/ISO credential vocabularies expect
# in `issuing_jurisdiction`. Either the bare suffix (KT) or the full code (NG-KT) is accepted
# wherever a reported locality is reconciled to a unit, so a register that says "NI" and a config
# that says "NG-NI" agree. A code that is not in the ISO 3166-2 table for this country is
# reported at start-up, not refused: a jurisdiction may legitimately run wards or LGAs that ISO
# does not enumerate.
#
# This file is written as a Katsina deployment (defaultSubnationalUnit, issuerDid). A Kaduna
# deployment sets `defaultSubnationalUnit: KD` and its own `credential.issuerDid` and
# `issuerName`; nothing else in the file is Katsina-specific.
subnationalUnits:
  - { code: KT, name: Katsina, parent: NG, level: state, iso3166_2: NG-KT } # inherits the country default
  - { code: KD, name: Kaduna, parent: NG, level: state, iso3166_2: NG-KD } # inherits the country default
  # Niger runs a statutory 12-digit numeric ID with a Luhn check instead of the Crockford
  # default -- no prefix, so it is pure digits (e.g. 481930274516). Its code is written in the
  # full ISO form here deliberately, to show that both forms reconcile.
  - code: NG-NI
    name: Niger
    parent: NG
    level: state
    iso3166_2: NG-NI
    residentId:
      alphabet: numeric
      groups: [11] # 11 random digits + 1 Luhn check = 12
      separator: ''
      prefix: { mode: none }
      checkDigit: { enabled: true, algorithm: luhn }
  - { code: ZA, name: Zamfara, parent: NG, level: state, iso3166_2: NG-ZA } # inherits the country default
